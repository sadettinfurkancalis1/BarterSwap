version: '3.8'

services:
  app:
    image: barterswap-app
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=barterswap
      - DATABASE_USER=barterswap_user
      - DATABASE_PASSWORD=BarterSwapSecure2025Pass

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=barterswap
      - POSTGRES_USER=barterswap_user
      - POSTGRES_PASSWORD=BarterSwapSecure2025Pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
